name: Daily crawl and email

on:
  schedule:
    # Fallback only; disabled by JOB_SCHEDULE_ENABLED=false when the desktop timer is installed.
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview the email without sending (crawl state is still saved)
        type: boolean
        default: true
      test_delivery:
        description: Send only to froggaguldev@gmail.com when dry_run is false
        type: boolean
        default: true

permissions:
  contents: write

# One writer across scheduled runs, manual runs, branches, and reruns.
concurrency:
  group: cheerupbot-crawl-state
  cancel-in-progress: false

jobs:
  crawl:
    if: github.event_name != 'schedule' || vars.JOB_SCHEDULE_ENABLED != 'false'
    runs-on: [self-hosted, linux, x64, cheerupbot]
    timeout-minutes: 45
    env:
      TZ: Asia/Seoul
      JOB_ENV_FILE: /dev/null
      JOB_AGENT_FILTER_PROVIDER: openai
      JOB_EMAIL_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
      JOB_EMAIL_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test_delivery && '1' || '0' }}
      JOB_RENDER_JS: '1'
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-6-luna' }}
      OPENAI_REASONING_EFFORT: ${{ vars.OPENAI_REASONING_EFFORT || 'medium' }}
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          clean: true
      - name: Prepare run paths
        # A persistent runner must never reuse another run's restore directory.
        run: |
          state_dir="${RUNNER_TEMP}/cheerupbot-state-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'JOB_STATE_DIR=%s\nJOB_STATE_FILE=%s/state.sql\n' "$state_dir" "$state_dir" >> "$GITHUB_ENV"
          # Private recipients live outside the checkout cleaned on every run.
          printf 'JOB_RECIPIENTS_FILE=%s\n' "${JOB_RECIPIENTS_FILE:-${HOME}/.config/cheerupbot/recipients.txt}" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
          # The desktop already keeps its local uv cache between runs.
          enable-cache: false
      - name: Install locked dependencies
        run: |
          uv python install 3.10
          uv sync --frozen --python 3.10 --managed-python
      - name: Check required credentials
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          .venv/bin/python - <<'PY'
          import os
          names = ['OPENAI_API_KEY']
          if os.environ['JOB_EMAIL_DRY_RUN'] != '1':
              names += ['SMTP_HOST', 'SMTP_USER', 'SMTP_PASSWORD']
          missing = [name for name in names if not os.getenv(name)]
          if missing:
              raise SystemExit('Missing GitHub Actions secrets: ' + ', '.join(missing))
          PY
      - name: Install and verify Chromium
        # System libraries are provisioned once on the desktop, without sudo in CI.
        run: |
          .venv/bin/python -m playwright install chromium
          .venv/bin/python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(headless=True)
              page = browser.new_page()
              page.set_content('<title>Runner browser check</title>')
              assert page.title() == 'Runner browser check'
              print('Chromium ready:', browser.version)
              browser.close()
          PY
      - name: Restore SQL snapshot
        id: restore
        run: .venv/bin/python scripts/sync_crawl_state.py restore --directory "$JOB_STATE_DIR"
      - name: Crawl, filter, and prepare email
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Delivery happens only after the repository snapshot is safely pushed.
          JOB_EMAIL_DRY_RUN: '1'
        run: bash scripts/run_daily_email.sh
      - name: Commit SQL snapshot
        if: ${{ always() && steps.restore.outcome == 'success' }}
        run: .venv/bin/python scripts/sync_crawl_state.py save --directory "$JOB_STATE_DIR"
      - name: Send email via SMTP
        if: ${{ success() && env.JOB_EMAIL_DRY_RUN != '1' }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: |
          test_args=()
          if [[ "$JOB_EMAIL_TEST" == '1' ]]; then
            test_args+=(--test-email)
          fi
          .venv/bin/python email_sender.py \
            --message-file out/jobs_message_latest.txt \
            --html-file out/jobs_message_latest.html \
            --subject '[알림] 오늘의 채용 요약' \
            --recipients-file "$JOB_RECIPIENTS_FILE" \
            --send-mode single \
            "${test_args[@]}" \
            --no-dotenv
      - name: Save reports and email preview
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: crawl-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/
            ${{ env.JOB_STATE_FILE }}
          if-no-files-found: ignore
          retention-days: 14
